<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Edge clusters managed by a central simplyblock control plane</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<!-- datacenter -->
<rect x="300" y="20" width="360" height="150" rx="10" fill="#f4f8fe" stroke="#1a237e" stroke-width="1.5"/>
<text x="480" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1a237e">Data center: hub cluster</text>
<rect x="325" y="62" width="150" height="88" rx="6" fill="#e8eaf6" stroke="#1a237e"/>
<text x="400" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#1a237e">Control plane</text>
<text x="400" y="106" text-anchor="middle" font-size="11" fill="#424a53">Management API</text>
<text x="400" y="122" text-anchor="middle" font-size="11" fill="#424a53">FoundationDB, monitoring</text>
<text x="400" y="138" text-anchor="middle" font-size="11" fill="#424a53">task runners</text>
<rect x="485" y="62" width="150" height="88" rx="6" fill="#e8eaf6" stroke="#1a237e"/>
<text x="560" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#1a237e">Simplyblock Operator</text>
<text x="560" y="106" text-anchor="middle" font-size="11" fill="#424a53">standalone profile</text>
<text x="560" y="122" text-anchor="middle" font-size="11" fill="#424a53">admin token for edges</text>
<!-- WAN -->
<text x="480" y="210" text-anchor="middle" font-size="12" fill="#57606a">WAN: Management API (HTTPS), SPDK RPC to the storage nodes</text>
<line x1="400" y1="170" x2="190" y2="262" stroke="#57606a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="560" y1="170" x2="770" y2="262" stroke="#57606a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
<!-- edge A: one node -->
<rect x="20" y="262" width="400" height="220" rx="10" fill="#f6f8fa" stroke="#424a53" stroke-width="1.5"/>
<text x="220" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#424a53">Edge site A: one node</text>
<rect x="45" y="304" width="350" height="56" rx="6" fill="#ffffff" stroke="#424a53"/>
<text x="220" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">Simplyblock Operator (managed profile), CSI driver</text>
<text x="220" y="345" text-anchor="middle" font-size="11" fill="#424a53">no control plane, no FoundationDB</text>
<rect x="45" y="374" width="350" height="88" rx="6" fill="#e8eaf6" stroke="#1a237e"/>
<text x="220" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">Worker 1: storage node + workloads</text>
<text x="220" y="418" text-anchor="middle" font-size="11" fill="#424a53">non-HA, erasure coding 1+0</text>
<text x="220" y="436" text-anchor="middle" font-size="11" fill="#424a53">NVMe or Linux block devices</text>
<!-- edge B: two nodes -->
<rect x="540" y="262" width="400" height="220" rx="10" fill="#f6f8fa" stroke="#424a53" stroke-width="1.5"/>
<text x="740" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#424a53">Edge site B: two nodes</text>
<rect x="565" y="304" width="350" height="56" rx="6" fill="#ffffff" stroke="#424a53"/>
<text x="740" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">Simplyblock Operator (managed profile), CSI driver</text>
<text x="740" y="345" text-anchor="middle" font-size="11" fill="#424a53">storage-fenced taint on arbitration</text>
<rect x="565" y="374" width="160" height="88" rx="6" fill="#e8eaf6" stroke="#1a237e"/>
<text x="645" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">Worker 1</text>
<text x="645" y="420" text-anchor="middle" font-size="11" fill="#424a53">storage node</text>
<text x="645" y="438" text-anchor="middle" font-size="11" fill="#424a53">journal + data copy</text>
<rect x="755" y="374" width="160" height="88" rx="6" fill="#e8eaf6" stroke="#1a237e"/>
<text x="835" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">Worker 2</text>
<text x="835" y="420" text-anchor="middle" font-size="11" fill="#424a53">storage node</text>
<text x="835" y="438" text-anchor="middle" font-size="11" fill="#424a53">journal + data copy</text>
<line x1="725" y1="418" x2="755" y2="418" stroke="#1a237e" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="740" y="476" text-anchor="middle" font-size="10" fill="#57606a">dedicated storage link between the nodes</text>
</svg>
