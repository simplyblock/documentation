name: Update Release Builder
on:
  push:
    branches:
      - 'update/**'

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: "documentation-release"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deployment:
    runs-on: ubuntu-latest
    outputs:
      release-name: ${{ steps.release-name.outputs.name }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: "Adjust Release Name: ${{ github.ref_name }}"
        id: release-name
        env:
          name: "${{ github.ref_name }}"
        run: |
          echo "RELEASE_NAME=$(echo ${name} | sed -e 's/.*\///g')" >> $GITHUB_ENV
          echo "name=$(echo ${name} | sed -e 's/.*\///g')" >> $GITHUB_OUTPUT
      - name: "Checkout Deployments"
        uses: actions/checkout@v4
        with:
          ref: deployments
          path: deployment
          fetch-depth: 1
          token: '${{ github.token }}'
      - name: "Ensure Existing Release"
        run: |
          if [ ! -d ./deployment/${RELEASE_NAME} ]; then
            echo "Release ${RELEASE_NAME} does not exist"
            exit 1
          fi
      - name: "Prepare Documentation Builder"
        uses: ./.github/actions/prepare-builder
      - name: "Lock sbcli/sbcli version"
        run: |
          [ -f ./scripts/sbcli.lock ] || echo "${{ env.RELEASE_NAME }}" > ./scripts/sbcli.lock
      - name: "Lock simplyblock-operator version"
        run: |
          ./scripts/operator-lock.sh "${{ env.RELEASE_NAME }}"
      - name: "Prepare Documentation Deployment: ${{ env.RELEASE_NAME }}"
        run: |
          ./doc-builder update-repositories
          ./doc-builder gen-operator-ref
          ./doc-builder deploy ${{ env.RELEASE_NAME }} --force
      - name: "Create Version Tag: ${{ env.RELEASE_NAME }}"
        run: |
          git config --global --add safe.directory $PWD
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git push --delete origin ${RELEASE_NAME} || echo "Remote tag ${RELEASE_NAME} does not exist"
          git tag -d ${RELEASE_NAME} || echo "Local tag ${RELEASE_NAME} does not exist"
          git add scripts/sbcli.lock
          if [ -f scripts/operator.lock ]; then git add scripts/operator.lock; fi
          git commit -m "Auto-Build: Lock ${RELEASE_NAME}" || echo "Lock files unchanged"
          git tag ${RELEASE_NAME}
          git push origin HEAD
          git push origin ${RELEASE_NAME}
      - name: "Publish to Deployments Branch: ${{ env.RELEASE_NAME }}"
        working-directory: ./deployment
        run: |
          git add -A
          git commit -m "Auto-Build: Rebuild ${RELEASE_NAME}" -m "Source: ${{ github.ref_name }}@$(git -C .. rev-parse --short HEAD)" || echo "Build produced no changes to commit"
          git pull --rebase origin deployments
          git push origin HEAD:deployments

  publish:
    needs: deployment
    uses: ./.github/workflows/publish-deployments.yaml
    secrets: inherit

  # The version tag now marks the build, so the branch is no longer needed. A
  # branch that moved on since the build is kept, because its own run is still
  # to come and deletes it afterwards.
  cleanup:
    needs: [deployment, publish]
    runs-on: ubuntu-latest
    steps:
      - name: "Delete Branch: ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RELEASE_NAME: ${{ needs.deployment.outputs.release-name }}
        run: |
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_NAME}" --jq .sha)
          if ! branch_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha 2>/dev/null); then
            echo "Branch ${BRANCH} is already gone"
          elif [ "${branch_sha}" != "${tag_sha}" ]; then
            echo "Branch ${BRANCH} moved past tag ${RELEASE_NAME}, keeping it"
          else
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
            echo "Deleted branch ${BRANCH}, tag ${RELEASE_NAME} marks the build"
          fi
