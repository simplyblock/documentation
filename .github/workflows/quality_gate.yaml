name: Quality Gate
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - 'main'
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: "quality-gate-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: "Set Up Go Tools"
        uses: ./.github/actions/go-tools
      - name: "Prepare Documentation Builder"
        uses: ./.github/actions/prepare-builder
      # The sbcli reference is not committed, and the operator and Helm chart
      # references follow the operator repository, so all three are generated
      # before the checks run. Without them the links into the reference pages
      # cannot be resolved.
      - name: "Generate References"
        run: |
          ./doc-builder update-repositories
          ./doc-builder gen-sbcli-ref
          ./doc-builder gen-operator-ref
          ./doc-builder gen-helm-ref
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "Run Quality Gates"
        run: |
          ./scripts/quality-gate.sh

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Determine Changed Documentation Files"
        id: changed
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            docs/**/*.md
            snippets/**/*.md
      - name: "Check Links In Changed Files"
        if: steps.changed.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            ${{ steps.changed.outputs.all_changed_files }}
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
