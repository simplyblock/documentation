name: Quality Gate
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - 'main'
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: "quality-gate-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "Run Quality Gates"
        run: |
          ./scripts/quality-gate.sh
