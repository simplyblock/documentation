name: Release Builder
on:
  push:
    branches:
      - 'release/**'

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: "documentation"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: "Checkout Deployments"
        uses: actions/checkout@v4
        with:
          ref: deployments
          path: deployment
          fetch-depth: 1
          token: '${{ github.token }}'
      - name: "Prepare Documentation Builder"
        run: |
          ./doc-builder build-image
      - name: "Adjust Release Name: ${{ github.ref_name }}"
        env:
          name: "${{ github.ref_name }}"
        run: |
          echo "RELEASE_NAME=$(echo ${name} | sed -e 's/.*\///g')" >> $GITHUB_ENV
      - name: "Lock sbcli/sbcli version"
        run: |
          [ -f ./scripts/sbcli.lock ] || echo "${{ env.RELEASE_NAME }}" > ./scripts/sbcli.lock
      - name: "Lock simplyblock-operator version"
        run: |
          ./scripts/operator-lock.sh "${{ env.RELEASE_NAME }}"
      - name: "Prepare Documentation Deployment: ${{ env.RELEASE_NAME }}"
        run: |
          ./doc-builder update-repositories
          ./doc-builder gen-operator-ref
          ./doc-builder deploy ${{ env.RELEASE_NAME }}
      - name: "Create Version Tag: ${{ env.RELEASE_NAME }}"
        run: |
          git config --global --add safe.directory $PWD
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git add scripts/sbcli.lock
          if [ -f scripts/operator.lock ]; then git add scripts/operator.lock; fi
          git commit -m "Auto-Build: Lock ${RELEASE_NAME}" || echo "Lock files unchanged"
          git tag ${RELEASE_NAME}
          git push origin HEAD
          git push origin ${RELEASE_NAME}
      - name: "Publish to Deployments Branch: ${{ env.RELEASE_NAME }}"
        working-directory: ./deployment
        run: |
          git add -A
          git commit -m "Auto-Build: ${RELEASE_NAME}" -m "Source: ${{ github.ref_name }}@$(git -C .. rev-parse --short HEAD)" || echo "Build produced no changes to commit"
          git pull --rebase origin deployments
          git push origin HEAD:deployments
          rm ./versions.json
          rm ./latest
      - name: "Upload Documentation"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          server-dir: /
          local-dir: ./deployment/
      - name: "Updating Latest"
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.ssh_server }}
          port: ${{ secrets.ssh_port }}
          username: ${{ secrets.ssh_username }}
          key: ${{ secrets.ssh_key }}
          script: |
            ./update-docs.sh ${{ env.RELEASE_NAME }}
