name: Pull Request Builder
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - auto_merge_enabled
      - auto_merge_disabled
      - closed
    branches:
      - 'main'

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: "documentation"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: "Prepare Documentation Builder"
        run: |
          ./doc-builder build-image
      - name: "Build Documentation Test"
        run: |
          ./doc-builder update-repositories
          ./doc-builder gen-operator-ref
          ./doc-builder build
  build-deploy-pr:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: "Compute Deployment Slug"
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "slug=${HEAD_REF//\//-}" >> "${GITHUB_OUTPUT}"
      - name: "Prepare Documentation Builder"
        run: |
          ./doc-builder build-image
      - name: "Build Documentation"
        run: |
          ./doc-builder update-repositories
          ./doc-builder gen-operator-ref
          ./doc-builder build
      - name: "Creating Deployment Artifact"
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          mv site "${SLUG}"
          ls -lah
          zip -r "${SLUG}.zip" . -i "${SLUG}/*"
      - name: "Uploading Pull Request Deployment"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ssh_server }}
          port: ${{ secrets.ssh_port }}
          username: ${{ secrets.ssh_username }}
          key: ${{ secrets.ssh_key }}
          source: "${{ steps.slug.outputs.slug }}.zip"
          target: .
      - name: "Deploying Pull Request Deployment"
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.ssh_server }}
          port: ${{ secrets.ssh_port }}
          username: ${{ secrets.ssh_username }}
          key: ${{ secrets.ssh_key }}
          envs: SLUG
          script: |
            ./pull_request_helper.sh deploy "${SLUG}"
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
      - name: Add Pull Request Deployment Comment"
        uses: actions/github-script@v7
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖: Deployment available as https://docstest.simplyblock.io/${process.env.SLUG}`
            })

  remove-closed-pr:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: "Compute Deployment Slug"
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "slug=${HEAD_REF//\//-}" >> "${GITHUB_OUTPUT}"
      - name: "Removing Pull Request Deployment"
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.ssh_server }}
          port: ${{ secrets.ssh_port }}
          username: ${{ secrets.ssh_username }}
          key: ${{ secrets.ssh_key }}
          envs: SLUG
          script: |
            ./pull_request_helper.sh remove "${SLUG}"
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
